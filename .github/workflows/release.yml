# Builds the server for Linux, Windows and macOS on a v* tag and publishes the binaries
# as that tag's GitHub release.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        run: |
          set -e
          for t in linux-amd64 linux-arm64 windows-amd64 darwin-arm64 darwin-amd64; do
            GOOS=${t%-*} GOARCH=${t#*-} CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "rendezvous-$t${GOOS:+}$([ ${t%-*} = windows ] && echo .exe)" ./cmd/rendezvous
          done
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "The rendezvous server. Run it anywhere: rendezvous -addr :7781, with TCP and UDP on that port open." rendezvous-*
